<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Study Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">
  <!-- 왼쪽 시간표 -->
  <div id="timetable">
    <h2>시간표</h2>
    <ul>
      <li data-start="19:10" data-end="20:10">저녁시간 19:10 ~ 20:10</li>
      <li data-start="20:10" data-end="20:40">1교시 20:10 ~ 20:40</li>
      <li data-start="20:40" data-end="21:00">쉬는시간 20:40 ~ 21:00</li>
      <li data-start="21:00" data-end="22:30">2교시 21:00 ~ 22:30</li>
    </ul>
  </div>

  <!-- 오른쪽 타이머 -->
  <div id="timer">
    <h1>스터디 타이머</h1>
    <div id="clock">--:--:--</div>
    <div id="period">현재 교시 없음</div>
  </div>
</div>

<!-- 종소리 -->
<audio id="bell" src="Bell.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
